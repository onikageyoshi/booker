# =============================================================================
# GitHub Actions CI/CD — Build & Deploy to Google Cloud Run
# =============================================================================
# Triggers on push to main. Uses Workload Identity Federation for auth.
#
# Setup (one-time):
#   1. Enable Workload Identity Federation in GCP
#   2. Create a Workload Identity Pool and Provider for GitHub
#   3. Bind the provider to a GCP Service Account with required roles
#   4. Add repository secrets (see Secrets section below)
# =============================================================================

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  AR_REPO_NAME: ${{ secrets.AR_REPO_NAME || 'booker-app' }}
  SERVICE_NAME: ${{ secrets.SERVICE_NAME || 'booker-api' }}

# Cancel in-progress runs for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Lint & Test ──────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry==2.1.3

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run linting
        run: |
          poetry run python -m py_compile apps/user/serializers.py
          poetry run python -m py_compile apps/user/views.py
          poetry run python -m py_compile core/settings.py

      - name: Run Django system checks
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: "true"
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ":memory:"
        run: poetry run python manage.py check

  # ─── Job 2: Build & Deploy ───────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Authentication via Workload Identity Federation ──────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ── Set up gcloud CLI ───────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ── Configure Docker for Artifact Registry ──────────────────────────
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ── Build Docker Image ──────────────────────────────────────────────
      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "FULL_IMAGE=${FULL_IMAGE}" >> $GITHUB_ENV
          docker build -t ${FULL_IMAGE} .

      # ── Push to Artifact Registry ───────────────────────────────────────
      - name: Push Docker image
        run: docker push ${{ env.FULL_IMAGE }}

      # ── Deploy to Cloud Run ─────────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          # Get Cloud SQL connection name
          INSTANCE_CONNECTION_NAME=$(gcloud sql instances describe ${{ secrets.DB_INSTANCE_NAME }} \
            --format="value(connectionName)")

          # Get latest image digest
          IMAGE_DIGEST=$(gcloud artifacts docker images describe ${{ env.FULL_IMAGE }} \
            --format="value(image_summary.digest)")

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.FULL_IMAGE }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=120 \
            --concurrency=80 \
            --set-env-vars="DJANGO_SETTINGS_MODULE=core.settings,DEBUG=false,DB_ENGINE=django.db.backends.postgresql,DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_HOST=/cloudsql/${INSTANCE_CONNECTION_NAME},DB_PORT=5432,DB_SSLMODE=disable" \
            --set-secrets="DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,CLOUDINARY_CLOUD_NAME=cloudinary-cloud-name:latest,CLOUDINARY_API_KEY=cloudinary-api-key:latest,CLOUDINARY_API_SECRET=cloudinary-api-secret:latest" \
            --add-cloudsql-instances=${INSTANCE_CONNECTION_NAME} \
            --service-account=${{ secrets.CLOUD_RUN_SA }} \
            --allow-unauthenticated

      # ── Run Migrations ──────────────────────────────────────────────────
      - name: Run database migrations
        run: |
          gcloud run services execute ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --command=python \
            --args="manage.py,migrate,--no-input"

      # ── Create Cache Table ──────────────────────────────────────────────
      - name: Create cache table
        run: |
          gcloud run services execute ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --command=python \
            --args="manage.py,createcachetable" || true

      # ── Output Service URL ──────────────────────────────────────────────
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format="value(status.url)")
          echo "🚀 Deployed to: ${SERVICE_URL}"
          echo "### Deployment Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "Service URL: ${SERVICE_URL}" >> $GITHUB_STEP_SUMMARY
